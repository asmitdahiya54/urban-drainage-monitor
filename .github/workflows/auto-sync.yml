
name: Auto Sync to Urban Drainage Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone destination
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git clone https://x-access-token:${SYNC_TOKEN}@github.com/asmitdahiya54/urban-drainage-monitor.git destination

      - name: Sync files
        run: |
          rsync -av \
            --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='destination/' \
            ./ destination/

      - name: Commit and push
        working-directory: destination
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Auto sync from Lovable"
            git push origin HEAD:main
          else
            echo "No changes to sync"
          fi

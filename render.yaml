# Render blueprint for the Urban Drainage Monitor Flask API.
# Deploy with Render â†’ New â†’ Blueprint (or configure the same values manually).
#
# The production database is SUPABASE PostgreSQL + PostGIS â€” this blueprint
# intentionally creates NO Render database. DATABASE_URL is marked `sync: false`
# so Render prompts for it at deploy time; paste the Supabase *Session Pooler*
# connection string there. No secrets live in this file: SECRET_KEY and
# JWT_SECRET_KEY are generated by Render.
services:
  - type: web
    name: urban-drainage-monitor-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    # Gunicorn serves the existing Flask app factory output; Render supplies $PORT.
    startCommand: gunicorn backend.wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_APP
        value: backend.app
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "120"
      - key: CORS_ORIGINS
        value: https://urban-drainage-monitor.vercel.app
      # Supabase Session Pooler connection string â€” entered in the Render
      # Supabase Session Pooler connection string is configured in the Render dashboard.
      - key: DATABASE_URL
        sync: false
